<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxName-Gen | Roblox Name Generator</title>
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --accent: #0EA5E9;
            --accent-hover: #38BDF8;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: var(--card-bg); width: 100%; max-width: 450px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
        h1 span { color: var(--accent); }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .display-box { background-color: rgba(15, 23, 42, 0.6); padding: 16px; border-radius: 8px; border: 2px dashed #334155; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; min-height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--accent); word-break: break-all; cursor: pointer; transition: all 0.2s; }
        .display-box:active { transform: scale(0.98); }
        .hint { font-size: 11px; color: var(--text-muted); margin-top: -15px; margin-bottom: 20px; display: block; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; text-align: left; }
        label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        select { width: 100%; background-color: #0F172A; border: 1px solid #334155; color: var(--text); padding: 10px; border-radius: 6px; outline: none; font-size: 14px; }
        .gen-btn { width: 100%; background-color: var(--accent); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .gen-btn:hover { background-color: var(--accent-hover); }
        .toast { position: fixed; bottom: 20px; background: #10B981; color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>BloxName<span>Gen</span></h1>
    <p class="subtitle">Generate clean, available-style Roblox usernames</p>
    
    <div class="display-box" id="nameDisplay" onclick="copyToClipboard()">Click Generate!</div>
    <span class="hint">Tap the name above to copy it</span>

    <div class="controls">
        <div>
            <label for="theme">Style Theme</label>
            <select id="theme">
                <option value="all">🎲 Random/Mixed</option>
                <option value="futuristic">🚀 Futuristic/Cyber</option>
                <option value="fantasy">🔮 Fantasy/Mythic</option>
                <option value="classic">🧱 Classic Roblox</option>
            </select>
        </div>
        <div>
            <label for="decor">Extra Flare</label>
            <select id="decor">
                <option value="none">None (Clean)</option>
                <option value="numbers">Add Numbers</option>
                <option value="og">OG Style (xX_Xx)</option>
            </select>
        </div>
    </div>

    <button class="gen-btn" onclick="generateName()">Generate Name</button>
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script src="script.js"></script>
</body>
</html>
